services:
  db:
    image: postgres:16-alpine
    container_name: cloudops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # accessible uniquement depuis la machine (seed, prisma studio)
    volumes:
      - pgdata:/var/lib/postgresql/data # persistance des données
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cloudops]

  backend:
    build: ./backend
    container_name: cloudops-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 3001
    ports:
      - "3001:3001"
    networks: [cloudops]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: cloudops-web
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "3000:3000"
    networks: [cloudops]

volumes:
  pgdata:

networks:
  cloudops:
